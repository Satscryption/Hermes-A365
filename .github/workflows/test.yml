name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — used to unblock CI when the push-trigger
  # scheduler is failing for a repo (2026-05-26: account-wide bug
  # where pushes generate zero check-suites; `has_actions: null`
  # via REST). Allows `gh workflow run test.yml --ref <branch>` to
  # run tests on any ref regardless of push-trigger state.
  workflow_dispatch:
  # publish.yml calls this so a release runs the same 3.11 and 3.14
  # suite against the tagged commit before the pypi environment. #98
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the package minimum. 3.14 is the Hermes gateway runtime
        # (NousResearch/hermes-agent; #148).
        python-version: ["3.11", "3.14"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}

      - name: ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest
