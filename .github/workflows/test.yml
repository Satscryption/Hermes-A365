name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — used to unblock CI when the push-trigger
  # scheduler is failing for a repo (2026-05-26: account-wide bug
  # where pushes generate zero check-suites; `has_actions: null`
  # via REST). Allows `gh workflow run test.yml --ref <branch>` to
  # run tests on any ref regardless of push-trigger state.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync --all-extras

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest
